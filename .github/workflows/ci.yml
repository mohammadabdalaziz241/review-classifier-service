name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  infra:
    # The AWS deployment code: Terraform formatting and validity, and the shell scripts.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - name: shellcheck
        run: shellcheck scripts/aws.sh infra/templates/start.sh

  test:
    # Fast suite against the dummy backend; database tests run on SQLite.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,db]"
      - run: pytest -m "not hf and not postgres"

  postgres-tests:
    # The same database tests against a real PostgreSQL.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,db]"
      - run: pytest -m postgres

  model-tests:
    # Loads a tiny locally built transformers model through the real code path.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # CPU-only torch keeps the install small; the default wheel bundles CUDA.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,hf,train]"
      # Includes train -> serve -> evaluate on a tiny model and synthetic data.
      - run: pytest -m hf

  docker:
    # Builds the real image with a model baked in, starts the whole stack
    # (PostgreSQL, migrations, API) and runs the end-to-end smoke test against it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Make a tiny model to bake into the image
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.46" pytest
          python -c "import pathlib; from tests.tiny_model import build_tiny_model; p = pathlib.Path('models/ci-tiny'); p.mkdir(parents=True); build_tiny_model(p)"
      - name: Build the image and start the stack
        env:
          MODEL_ID: /opt/models/ci-tiny
        run: docker compose up --build --detach
      - name: Smoke test
        run: python scripts/smoke_test.py --expect-database --timeout 300
      - name: Predictions stored in PostgreSQL
        run: >-
          docker compose exec -T db psql -U reviews -d reviews
          -c "select endpoint, batch_index, label, model_version from predictions"
      - name: Image size
        run: docker image ls review-classifier
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
