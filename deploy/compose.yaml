# Production stack on the EC2 instance, shipped inside every release image.
#
# The instance's start.sh (infra/templates/start.sh) copies this release's files out
# of the image into /opt/review-classifier/release, puts this file at
# /opt/review-classifier/compose.yaml and runs it from there; .env is written by
# start.sh. Container logs go to CloudWatch, one stream per container.
#
# Only the API is public (port 80). Its metrics (port 9000), Prometheus and the node
# exporter stay inside the stack; Grafana listens on the instance's loopback
# interface and is reached through a Session Manager tunnel (scripts/aws.sh dashboard).

name: review-classifier

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${LOG_GROUP}
    tag: "{{.Name}}"

x-database-url: &database-url postgresql://reviews:${POSTGRES_PASSWORD}@db:5432/reviews

services:
  db:
    # Docker's official image, served from the ECR Public mirror (no Docker Hub limits).
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_DB: reviews
      POSTGRES_USER: reviews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviews -d reviews"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  migrate:
    image: ${IMAGE:?IMAGE is not set}
    command: ["python", "-m", "review_classifier.db", "--wait", "60", "upgrade"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    image: ${IMAGE:?IMAGE is not set}
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: info
      METRICS_PORT: "9000"
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    environment:
      # Changes when the monitoring files change, so the container is recreated with them.
      CONFIG_VERSION: ${MONITORING_CONFIG_VERSION:-unset}
    volumes:
      - ./release/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      CONFIG_VERSION: ${MONITORING_CONFIG_VERSION:-unset}
      # Read-only dashboards for anyone who can open the tunnel; no logins at all.
      # Dashboards and the data source are provisioned from files in this release.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/review-classifier.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - ./release/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./release/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
