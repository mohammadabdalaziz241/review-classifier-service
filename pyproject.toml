[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "review-classifier-service"
version = "0.1.0"
description = "FastAPI inference service for sentiment and sarcasm classification of English reviews."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohammad Abdalaziz" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "prometheus-client>=0.20",
    "pydantic>=2.6,<3.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# Real model backend. Install torch separately first if you want the CPU-only wheel.
hf = [
    "huggingface_hub>=0.23",
    "torch>=2.2",
    "transformers>=4.46",  # Trainer(processing_class=...), eval_strategy
]
# Training (review_classifier.train) and service evaluation (review_classifier.evaluate).
train = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "httpx>=0.27",
]
# Recording predictions and feedback in a database (DATABASE_URL).
db = [
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0.30",
]
dev = [
    "httpx>=0.27",
    "huggingface_hub>=0.23",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/review_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "hf: tests that load a real (tiny, locally built) transformers model; need the [hf] extra",
    "postgres: tests that need PostgreSQL at TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Shell commands in notebook cells are long single lines.
"notebooks/*.ipynb" = ["E501"]
