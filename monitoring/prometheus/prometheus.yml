# Prometheus for the review classifier stack (local profile and the AWS instance).
# Targets are Compose service names on the stack's network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API's metrics port (METRICS_PORT=9000), not published outside the stack.
  - job_name: api
    static_configs:
      - targets: ["api:9000"]

  # Host CPU, memory, disk and network of the machine running the stack.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
